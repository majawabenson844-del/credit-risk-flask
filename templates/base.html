<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ✅ Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color:#0b0b0b; color:#f5c77a; }

    /* Navbar */
    .navbar { background-color:#121212; }
    .navbar-brand, .nav-link {
      color:#f5c77a !important; 
      font-weight:600;
      font-size:18px;
    }
    .nav-link:hover {
      color:#ffd98e !important;
      text-shadow:0 0 5px rgba(245,199,122,0.7);
    }
    .nav-link.active {
      color:#ffffff !important;
      font-weight:800;
      border-bottom:2px solid #f5c77a;
    }

    /* ✅ Mobile navbar toggler */
    .navbar-toggler {
      border-color: #f5c77a;
    }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' \
      xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba(245,199,122,1)' \
      stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' \
      d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    /* Cards */
    .card {
      background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid rgba(245, 199, 122, 0.2);
      box-shadow: 0 0 25px rgba(245, 199, 122, 0.15);
      color:#f5c77a;
    }

    /* Headings */
    h1,h2,h3,h4,h5,h6 { 
      color:#f5c77a !important; 
      font-weight:800; 
      letter-spacing:1px; 
    }

    /* Labels & form controls */
    label { font-size:18px; font-weight:700; color:#f5c77a; }
    .form-control, .form-select {
      background-color:#121212;
      color:#f5c77a;
      border:1px solid #f5c77a;
    }
    .form-control:focus, .form-select:focus {
      border-color:#ffd98e;
      box-shadow:0 0 10px rgba(245,199,122,0.5);
    }
    option { color:#000; }

    /* Buttons */
    .btn-warning {
      background: linear-gradient(90deg, #f5c77a, #ffd98e);
      color:black; border-radius:12px;
      font-weight:800; box-shadow:0 0 15px rgba(245,199,122,0.4);
    }
    .btn-warning:hover { transform:scale(1.05); box-shadow:0 0 25px rgba(245,199,122,0.7); }

    /* Alerts */
    .alert-success { background-color:#28a745; color:#fff; font-weight:700; }
    .alert-danger { background-color:#dc3545; color:#fff; font-weight:700; }
    .alert-info { background-color:#17a2b8; color:#fff; font-weight:700; }

    /* Footer */
    footer {
      background-color:#121212;
      color:#f5c77a;
      text-align:center;
      padding:15px;
      margin-top:40px;
      border-top:1px solid rgba(245,199,122,0.3);
      font-weight:600;
    }

    /* ✅ Slightly larger text on small screens */
    @media (max-width: 576px) {
      body, p, label, .form-label {
        font-size: 1.1rem;
      }
      .navbar-brand { font-size:20px; }
    }
  </style>
</head>
<body>

  <!-- 🔧 Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">💳 Credit Risk</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
              data-bs-target="#navbarNav" aria-controls="navbarNav" 
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link {% if title=='Home' %}active{% endif %}" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='Predict' %}active{% endif %}" href="/predict">Predict</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='Model Info' %}active{% endif %}" href="/model-info">Model Info</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='Feature Guide' %}active{% endif %}" href="/feature-guide">Feature Guide</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='About' %}active{% endif %}" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='History' %}active{% endif %}" href="/history">History</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container my-4">
    {% block content %}{% endblock %}
  </div>

  <!-- 🔧 Footer -->
  <footer>
    © 2026 Benson Majawa +263780966606 . All rights reserved.
  </footer>

  <!-- ✅ Bootstrap JS for navbar toggler -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
