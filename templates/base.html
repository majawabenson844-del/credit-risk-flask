<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color:#0b0b0b; color:#f5c77a; }
    .navbar { background-color:#121212; }
    .navbar-brand, .nav-link {
      color:#f5c77a !important; 
      font-weight:600;
      font-size:18px;
    }
    .nav-link:hover {
      color:#ffd98e !important;
      text-shadow:0 0 5px rgba(245,199,122,0.7);
    }
    .nav-link.active {
      color:#ffffff !important;
      font-weight:800;
      border-bottom:2px solid #f5c77a;
    }
    .card {
      background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid rgba(245, 199, 122, 0.2);
      box-shadow: 0 0 25px rgba(245, 199, 122, 0.15);
    }
    h1,h2,h3 { color:#f5c77a !important; font-weight:800; letter-spacing:1px; }
    label { font-size:18px; font-weight:700; color:#f5c77a; }
    .btn-warning {
      background: linear-gradient(90deg, #f5c77a, #ffd98e);
      color:black; border-radius:12px;
      font-weight:800; box-shadow:0 0 15px rgba(245,199,122,0.4);
    }
    .btn-warning:hover { transform:scale(1.05); box-shadow:0 0 25px rgba(245,199,122,0.7); }
  </style>
</head>
<body>

  <!-- 🔧 Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">💳 Credit Risk</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
              data-bs-target="#navbarNav" aria-controls="navbarNav" 
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="color:#f5c77a;"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link {% if title=='Home' %}active{% endif %}" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='Predict' %}active{% endif %}" href="/predict">Predict</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='Model Info' %}active{% endif %}" href="/model-info">Model Info</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='Feature Guide' %}active{% endif %}" href="/feature-guide">Feature Guide</a></li>
          <li class="nav-item"><a class="nav-link {% if title=='About' %}active{% endif %}" href="/about">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container my-4">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
